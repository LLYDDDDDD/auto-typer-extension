<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>自动打字测试</title>
<style>body{font:16px system-ui;max-width:720px;margin:48px auto;padding:0 20px;color:#234}input,textarea,[contenteditable]{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #aab8c8;border-radius:8px;font:inherit;margin:12px 0 28px}textarea,[contenteditable]{min-height:100px}label{font-weight:600}button{padding:8px 18px}</style>
<h1>自动打字测试</h1><p>在本页打开扩展，输入测试文字，开始后点击下方任意编辑框。</p>
<label>单行输入</label><input id="single" placeholder="点击这里放置光标">
<label>多行输入</label><textarea id="multi" placeholder="可输入中文、换行、表情"></textarea>
<label>富文本编辑框</label><div id="rich" contenteditable="true" role="textbox" aria-label="富文本编辑框"></div>
<label>用于测试焦点变化</label><input id="other" placeholder="输入期间点击这里，任务应停止">
</html>
